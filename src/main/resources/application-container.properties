# Container profile - for use with docker-compose
# All sensitive values come from environment variables via docker-compose

# Disable Google Drive config (no credentials in container)
spring.drive.path=

# MinIO/S3 Configuration - values from environment
# These will be set via SPRING_* env vars in docker-compose
# aws.s3.endpoint - set via AWS_S3_ENDPOINT
# aws.s3.access-key - set via AWS_S3_ACCESS_KEY
# aws.s3.secret-key - set via AWS_S3_SECRET_KEY
# aws.s3.bucket - set via AWS_S3_BUCKET
# aws.s3.region - set via AWS_S3_REGION

# Elasticsearch - set via SPRING_ELASTICSEARCH_URIS
# Kafka - set via SPRING_KAFKA_BOOTSTRAP_SERVERS and APP_KAFKA_TOPIC

# Kafka Producer/Consumer settings
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.ByteArraySerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.max.request.size=52428800
spring.kafka.producer.buffer-memory=10485760


spring.kafka.consumer.group-id=file-consumer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
spring.kafka.consumer.properties.fetch-max-bytes=5242880
spring.kafka.consumer.properties.max-partition-fetch-bytes=5242880

# Upload limits - set via env vars in docker-compose
# spring.servlet.multipart.max-file-size
# spring.servlet.multipart.max-request-size

# Tesseract - set via TESSERACT_DATAPATH

# Email settings - set via SPRING_MAIL_* env vars
spring.mail.store.protocol=imaps
spring.mail.properties.mail.imaps.ssl.enable=true
spring.mail.properties.mail.debug=false

# LLM API settings - set via env vars
# openai.api.key - set via OPENAI_API_KEY
# openai.api.url - set via OPENAI_API_URL
# openai.model - set via OPENAI_MODEL
# gemini.api.key - set via GEMINI_API_KEY
# gemini.api.url - set via GEMINI_API_URL

# Logging
logging.level.root=INFO
logging.level.com.example.elastic=DEBUG
logging.level.org.springframework.kafka=INFO
logging.level.org.elasticsearch=WARN

# Spring Boot admin
spring.main.allow-bean-definition-overriding=true
